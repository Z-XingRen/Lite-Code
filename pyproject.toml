[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lite"
version = "0.3.0"
description = "Small local coding agent for OpenAI-compatible, Anthropic-compatible, and DeepSeek models"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0.0",
  "textual>=0.86.0",
  "tomli>=2.0.0; python_version < '3.11'",
  "tzdata>=2025.2; sys_platform == 'win32'",
]

[project.scripts]
lite = "lite.cli:main"
lite-tui = "lite.tui.main:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6.0",
  "mypy>=1.14.0",
  "pytest>=8.3.5",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.4.4",
]

[tool.setuptools.packages.find]
include = ["lite*"]

[tool.pytest.ini_options]
addopts = "-m 'not stress'"
testpaths = ["tests"]
markers = [
  "stress: deterministic long-session and scaling gates run separately in CI",
]
norecursedirs = [
  ".git",
  ".lite",
  ".venv",
  ".worktrees",
  "_local",
  "artifacts",
  "build",
  "dist",
  "examples",
  "fixtures",
]

[tool.ruff]
extend-exclude = ["benchmarks/formal_v1/fixtures"]

[tool.mypy]
python_version = "3.10"
files = [
  "lite/features/sandbox/config.py",
  "lite/features/sandbox/checker.py",
  "lite/core/runtime.py",
  "lite/core/run_store.py",
  "lite/core/tool_execution.py",
  "lite/core/worker_inputs.py",
  "lite/core/worker_manager.py",
]
strict = true
follow_imports = "skip"
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "lite.core.runtime",
  "lite.core.run_store",
  "lite.core.tool_execution",
  "lite.core.worker_inputs",
  "lite.core.worker_manager",
]
allow_untyped_defs = true
allow_untyped_calls = true
allow_any_generics = true
allow_subclassing_any = true
check_untyped_defs = true

[tool.coverage.run]
branch = true
include = [
  "lite/core/session_journal*.py",
  "lite/evaluation/runtime_evidence.py",
  "lite/features/sandbox/*.py",
]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
fail_under = 80
show_missing = true
skip_covered = true
